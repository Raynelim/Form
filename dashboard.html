<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form — Dashboard</title>
<link rel="stylesheet" href="css/form.css">
</head>
<body>
<div class="phone">

  <header class="topbar">
    <div class="tb-left">
      <span class="tb-greeting" id="tbGreet">good morning</span>
      <span class="tb-name">Alex</span>
    </div>
    <div class="tb-right">
      <div class="tb-streak">
        <span class="tb-streak-ic">&#x25CA;</span>
        <span class="tb-streak-n">7</span>
      </div>
      <a class="tb-avatar" href="profile.html">&#x25C8;</a>
    </div>
  </header>

  <div class="content">

    <!-- Hero card -->
    <div class="hero-card">
      <div class="hero-ghost">15</div>
      <div class="hero-lvl">LVL 15</div>
      <div class="hero-handle">player</div>
      <div class="hero-name">Alex</div>
      <div class="sage-pill">
        <div class="sp-dot"></div>
        <span class="sp-txt">The Polyglot</span>
      </div>
      <div class="hero-lvl-bar">
        <span class="lvl-tag">LVL 15</span>
        <div class="xb-track" style="flex:1">
          <div class="xb-fill" style="width:42%;background:var(--sage)"></div>
        </div>
        <span class="lvl-tag">LVL 16</span>
        <span class="lvl-xp">7,400 xp</span>
      </div>
    </div>

    <!-- Quick log -->
    <div class="section-head" style="margin-top:4px">
      <span class="lbl">quick log</span>
    </div>
    <div class="ql-pills" id="quickPills"></div>

    <!-- Stats -->
    <div class="section-head" style="margin-top:16px">
      <span class="lbl">stats</span>
      <span class="lbl" style="color:var(--t4)">tap to expand</span>
    </div>
    <div class="card" style="padding:0 0 0 16px">
      <div class="stat-list" id="statsGrid"></div>
    </div>

    <div class="divider"></div>

    <!-- Quests preview -->
    <div class="section-head">
      <span class="lbl">today's quests</span>
      <span id="qCount" style="font-family:var(--font-m);font-size:9px;color:var(--sage)"></span>
    </div>
    <div class="card">
      <div id="qList"></div>
      <div style="text-align:right;margin-top:8px">
        <span class="lbl" style="color:var(--t3)">+200 XP if all complete</span>
      </div>
    </div>

  </div><!-- /content -->

  <nav class="bottom-nav">
    <a class="bn-item active" href="dashboard.html"><span class="bn-ic">&#x2302;</span><span class="bn-label">Home</span></a>
    <a class="bn-item" href="stat.html"><span class="bn-ic">&#x25C8;</span><span class="bn-label">Stats</span></a>
    <a class="bn-item" href="log.html"><span class="bn-ic">&#x2295;</span><span class="bn-label">Log</span></a>
    <a class="bn-item" href="quests.html"><span class="bn-ic">&#x25FB;</span><span class="bn-label">Quests</span></a>
    <a class="bn-item" href="profile.html"><span class="bn-ic">&#x25C9;</span><span class="bn-label">Profile</span></a>
    <a class="bn-item" href="leaderboard.html"><span class="bn-ic">&#x25B3;</span><span class="bn-label">Ranks</span></a>
  </nav>

</div>

<script src="js/form.js"></script>
</body>
</html>
