<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Form</title>
  <link rel="stylesheet" href="../css/form.css" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #F7F8F5 0%, #EEF3EE 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .auth-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 0 24px;
    }
    .form-wordmark {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2.6rem;
      color: #5C8A6E;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
      text-align: center;
    }
    .form-tagline {
      font-family: var(--font-d);
      font-size: 1.08rem;
      color: var(--t2);
      margin-bottom: 32px;
      text-align: center;
    }
    .auth-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px 0 rgba(92,138,110,0.10), 0 1.5px 4px 0 rgba(60,107,82,0.04);
      padding: 32px 24px 24px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .auth-input {
      width: 100%;
      height: 48px;
      border: 1px solid #E4EBE4;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 1rem;
      font-family: var(--font-d);
      color: var(--t1);
      background: #fff;
      outline: none;
      transition: border 0.18s, box-shadow 0.18s;
    }
    .auth-input::placeholder {
      color: #A3AFA3;
      opacity: 1;
      font-family: var(--font-d);
    }
    .auth-input:focus {
      border: 1.5px solid #5C8A6E;
      box-shadow: 0 0 0 2px rgba(92,138,110,0.10);
    }
    .auth-btn {
      width: 100%;
      height: 48px;
      background: #5C8A6E;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .08em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.18s;
      margin-top: 6px;
    }
    .auth-btn:hover {
      background: #3D6B52;
    }
    .auth-link {
      display: block;
      text-align: center;
      font-family: var(--font-d);
      font-size: 0.98rem;
      color: #5C8A6E;
      text-decoration: none;
      margin-top: 2px;
      transition: color 0.15s;
    }
    .auth-link:hover {
      color: #3D6B52;
      text-decoration: underline;
    }
    @media (max-width: 480px) {
      .auth-container {
        padding: 18px 0 12px;
      }
      .auth-card {
        padding: 22px 8px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="form-wordmark">Form</div>
    <div class="form-tagline">Track yourself. Level up.</div>
    <form class="auth-card" id="registerForm" autocomplete="on">
      <input class="auth-input" type="text" name="username" placeholder="Username" required />
      <input class="auth-input" type="email" name="email" placeholder="Email" required />
      <input class="auth-input" type="password" name="password" placeholder="Password" required />
      <input class="auth-input" type="password" name="confirm" placeholder="Confirm Password" required />
      <button class="auth-btn" type="submit">Create account</button>
    </form>
    <a class="auth-link" href="login.html">Already have an account? Log in</a>
  </div>
  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
