<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form — Log In</title>
<link rel="stylesheet" href="css/form.css">
</head>
<body>
<div class="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <span class="sb-time" id="sbTime">9:41</span>
    <span class="sb-icons">&#x25CF;&#x25CF;&#x25CF; WiFi &#x25AE;&#x25AE;&#x25AE;</span>
  </div>

  <!-- Auth screen — no topbar, no bottom nav -->
  <div class="auth-screen">

    <!-- Logo -->
    <div class="auth-logo">Form</div>
    <div class="auth-tagline">Track yourself. Level up.</div>

    <!-- Card -->
    <div class="auth-card">
      <div class="auth-card-title">Welcome back</div>

      <div class="field-wrap">
        <label class="field-label" for="email">Email</label>
        <input class="field-input" id="email" type="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="field-wrap">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div style="text-align:right;margin-bottom:18px">
        <span style="font-family:var(--font-m);font-size:9px;color:var(--sage);cursor:pointer;letter-spacing:.08em">
          FORGOT PASSWORD?
        </span>
      </div>

      <button class="cta-btn" onclick="handleLogin()">Log In</button>
    </div>

    <div class="auth-switch">
      Don't have an account? <a href="register.html">Register</a>
    </div>

  </div>

</div>

<script src="js/form.js"></script>
<script>
  // Clock for status bar
  function tickAuth() {
    const now = new Date(), h = now.getHours(), m = now.getMinutes();
    const el = document.getElementById('sbTime');
    if (el) el.textContent = (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m;
  }
  tickAuth();
  setInterval(tickAuth, 30000);

  function handleLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) {
      showError('Please fill in all fields.');
      return;
    }
    // Simulate login — redirect to dashboard
    window.location.href = 'dashboard.html';
  }

  function showError(msg) {
    let err = document.getElementById('authError');
    if (!err) {
      err = document.createElement('div');
      err.id = 'authError';
      err.style.cssText =
        'font-family:var(--font-m);font-size:9px;color:#C0392B;' +
        'letter-spacing:.08em;text-align:center;margin-top:10px;padding:8px 12px;' +
        'background:#FDF0F0;border:1px solid #F5D5D3;border-radius:8px;';
      document.querySelector('.auth-card').appendChild(err);
    }
    err.textContent = msg;
  }

  // Remove DOMContentLoaded renders from form.js since this page has no app screens
  document.addEventListener('DOMContentLoaded', () => {}, true);
</script>
</body>
</html>
