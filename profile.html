<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form — Profile</title>
<link rel="stylesheet" href="css/form.css">
</head>
<body>
<div class="phone">

  <div class="status-bar">
    <span class="sb-time" id="sbTime">9:41</span>
    <span class="sb-icons">&#x25CF;&#x25CF;&#x25CF; WiFi &#x25AE;&#x25AE;&#x25AE;</span>
  </div>

  <header class="topbar">
    <div class="tb-left">
      <span class="tb-greeting" id="tbGreet">good morning</span>
      <span class="tb-name">Profile</span>
    </div>
    <div class="tb-right">
      <div class="tb-streak">
        <span class="tb-streak-ic">&#x25CA;</span>
        <span class="tb-streak-n">7</span>
      </div>
      <div class="tb-avatar">&#x25C8;</div>
    </div>
  </header>

  <div class="content">

    <div class="pg-title">Profile</div>

    <!-- Profile header -->
    <div class="p-header">
      <div class="p-av">&#x25C8;</div>
      <div style="flex:1">
        <div class="p-handle">ALEX_01</div>
        <div class="sage-pill" style="margin-top:6px">
          <div class="sp-dot"></div>
          <span class="sp-txt">The Polyglot</span>
        </div>
        <div class="p-meta">&#x25CA; 7-day streak &nbsp;&middot;&nbsp; Lv.15</div>
      </div>
      <button class="shr-btn">&#x2197; SHARE</button>
    </div>

    <!-- Spider graph -->
    <div class="graph-card">
      <span class="lbl" style="display:block;margin-bottom:12px">stat radar</span>
      <div class="gw">
        <svg id="spSvg" width="236" height="236"
             viewBox="0 0 236 236"
             xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="gleg">
        <div class="gli">
          <div class="gll" style="background:var(--sage)"></div>
          <span class="lbl">You</span>
        </div>
        <div class="gli">
          <div class="gll" style="background:var(--t3)"></div>
          <span class="lbl">30d ago</span>
        </div>
      </div>
    </div>

    <!-- Grade strip -->
    <div class="grade-strip-card">
      <span class="lbl" style="display:block;margin-bottom:12px">grades</span>
      <div class="gs" id="gradeStrip"></div>
    </div>

    <!-- Titles -->
    <div class="titles-card">
      <span class="lbl" style="display:block;margin-bottom:12px">titles</span>
      <div id="titlesEl"></div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a class="bn-item" href="dashboard.html"><span class="bn-ic">&#x2302;</span><span class="bn-label">Home</span></a>
    <a class="bn-item" href="stat.html"><span class="bn-ic">&#x25C8;</span><span class="bn-label">Stats</span></a>
    <a class="bn-item" href="log.html"><span class="bn-ic">&#x2295;</span><span class="bn-label">Log</span></a>
    <a class="bn-item" href="quests.html"><span class="bn-ic">&#x25FB;</span><span class="bn-label">Quests</span></a>
    <a class="bn-item active" href="profile.html"><span class="bn-ic">&#x25C9;</span><span class="bn-label">Profile</span></a>
    <a class="bn-item" href="leaderboard.html"><span class="bn-ic">&#x25B3;</span><span class="bn-label">Ranks</span></a>
  </nav>

</div>

<script src="js/form.js"></script>
</body>
</html>
