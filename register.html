<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form — Register</title>
<link rel="stylesheet" href="css/form.css">
</head>
<body>
<div class="phone">

  <div class="auth-screen">

    <div class="auth-logo">Form</div>
    <div class="auth-tagline">Track yourself. Level up.</div>

    <div class="auth-card">
      <div class="auth-card-title">Create account</div>

      <div class="field-wrap">
        <label class="field-label" for="username">Username</label>
        <input class="field-input" id="username" type="text" placeholder="ALEX_01" autocomplete="username">
      </div>

      <div class="field-wrap">
        <label class="field-label" for="email">Email</label>
        <input class="field-input" id="email" type="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="field-wrap">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" id="password" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>

      <div class="field-wrap" style="margin-bottom:20px">
        <label class="field-label" for="confirm">Confirm Password</label>
        <input class="field-input" id="confirm" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>

      <button class="cta-btn" onclick="handleRegister()">Create Account</button>
    </div>

    <div class="auth-switch">
      Already have an account? <a href="index.html">Log in</a>
    </div>

  </div>

</div>

<script>
  function tickAuth() {
    const now = new Date(), h = now.getHours(), m = now.getMinutes();
    const el = document.getElementById('sbTime');
    if (el) el.textContent = (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m;
  }
  tickAuth();
  setInterval(tickAuth, 30000);

  function handleRegister() {
    const username = document.getElementById('username').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    if (!username || !email || !password || !confirm) {
      showError('Please fill in all fields.');
      return;
    }
    if (password !== confirm) {
      showError('Passwords do not match.');
      return;
    }
    if (password.length < 8) {
      showError('Password must be at least 8 characters.');
      return;
    }
    // Simulate registration — redirect to dashboard
    window.location.href = 'dashboard.html';
  }

  function showError(msg) {
    let err = document.getElementById('authError');
    if (!err) {
      err = document.createElement('div');
      err.id = 'authError';
      err.style.cssText =
        'font-family:"Share Tech Mono",monospace;font-size:9px;color:#C0392B;' +
        'letter-spacing:.08em;text-align:center;margin-top:10px;padding:8px 12px;' +
        'background:#FDF0F0;border:1px solid #F5D5D3;border-radius:8px;';
      document.querySelector('.auth-card').appendChild(err);
    }
    err.textContent = msg;
  }
</script>
</body>
</html>
